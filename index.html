<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zenith — Premium Strategy Suite</title>
    <!-- Lucide Icons & Typography -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-ambient: #fcfcfd;
            --surface-glass: rgba(255, 255, 255, 0.85);
            --card-base: #ffffff;
            --text-primary: #0a0d14;
            --text-secondary: #64748b;
            --accent-gold: #b4975a;
            --accent-gold-light: rgba(180, 151, 90, 0.1);
            --border-crisp: rgba(0, 0, 0, 0.06);
            --shadow-luxury: 0 20px 40px -15px rgba(0, 0, 0, 0.05);
            --tint-fitness: #10b981;
            --danger: #ef4444;
            --ease-premium: cubic-bezier(0.16, 1, 0.3, 1);
            --input-bg: #f8fafc;
            --cal-day-bg: #f8fafc;
        }

        /* --- Dark Mode Theme Overrides --- */
        [data-theme="dark"] {
            --bg-ambient: #0b0f17;
            --surface-glass: rgba(15, 23, 42, 0.85);
            --card-base: #131926;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-gold: #d4af37;
            --accent-gold-light: rgba(212, 175, 55, 0.15);
            --border-crisp: rgba(255, 255, 255, 0.06);
            --shadow-luxury: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            --input-bg: #1e293b;
            --cal-day-bg: #1e293b;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-ambient);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            transition: background-color 0.4s var(--ease-premium), color 0.4s var(--ease-premium);
        }

        /* Ambient subtle light source */
        .ambient-glow {
            position: fixed;
            top: -10%;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 400px;
            background: radial-gradient(circle, rgba(180, 151, 90, 0.06) 0%, rgba(255,255,255,0) 70%);
            z-index: 0;
            pointer-events: none;
        }

        [data-theme="dark"] .ambient-glow {
            background: radial-gradient(circle, rgba(212, 175, 55, 0.04) 0%, rgba(0,0,0,0) 70%);
        }

        .app-container {
            width: 100%;
            max-width: 430px;
            min-height: 100vh;
            position: relative;
            z-index: 1;
            padding: 24px 24px 120px 24px;
            display: flex;
            flex-direction: column;
        }

        /* --- Header --- */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding: 4px 0;
        }

        .brand-space {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-logo {
            width: 36px;
            height: 36px;
            border-radius: 12px;
            background: var(--text-primary);
            color: var(--bg-ambient);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.3s, color 0.3s;
        }

        .brand-name {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .theme-toggle-btn {
            border: 1px solid var(--border-crisp);
            background: var(--card-base);
            width: 36px;
            height: 36px;
            border-radius: 12px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: var(--shadow-luxury);
            transition: all 0.3s;
        }

        .header-cancel-btn {
            display: none;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 600;
            color: var(--danger);
            background: rgba(239, 68, 68, 0.08);
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }

        /* --- Search Bar --- */
        .search-container {
            position: relative;
            margin-bottom: 16px;
        }

        .search-container svg {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            pointer-events: none;
        }

        .search-input {
            padding-left: 44px !important;
        }

        /* --- Forms & Inputs --- */
        .premium-input-deck {
            background: var(--card-base);
            border: 1px solid var(--border-crisp);
            border-radius: 24px;
            padding: 20px;
            box-shadow: var(--shadow-luxury);
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
            transition: background-color 0.3s, border-color 0.3s;
        }

        .text-input-wrapper {
            position: relative;
        }

        .premium-input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid transparent;
            border-radius: 14px;
            padding: 14px 16px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            transition: all 0.3s var(--ease-premium);
        }

        .premium-input:focus {
            background: var(--card-base);
            border-color: var(--accent-gold);
            box-shadow: 0 0 0 4px var(--accent-gold-light);
        }

        .form-split-row {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 12px;
        }

        .premium-btn {
            width: 100%;
            background: var(--text-primary);
            color: var(--bg-ambient);
            border: none;
            border-radius: 14px;
            padding: 14px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.3s var(--ease-premium);
        }

        .premium-btn:active {
            transform: scale(0.98);
            opacity: 0.9;
        }

        .premium-btn.edit-mode-active {
            background: var(--accent-gold);
            color: #ffffff;
        }

        /* --- App Pages --- */
        .app-page {
            display: none;
            opacity: 0;
            transform: translateY(12px) scale(0.98);
            transition: opacity 0.3s var(--ease-premium), transform 0.3s var(--ease-premium);
        }

        .app-page.active {
            display: block;
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        /* --- Luxury Task Cards --- */
        .task-card-luxury {
            background: var(--card-base);
            border: 1px solid var(--border-crisp);
            border-radius: 20px;
            padding: 18px;
            box-shadow: var(--shadow-luxury);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            transition: all 0.4s var(--ease-premium);
        }

        .task-card-luxury.completed {
            opacity: 0.5;
            background: var(--input-bg);
        }

        @keyframes pulseBorder {
            0% { border-color: var(--border-crisp); box-shadow: var(--shadow-luxury); }
            50% { border-color: rgba(239, 68, 68, 0.4); box-shadow: 0 0 15px rgba(239,68,68,0.1); }
            100% { border-color: var(--border-crisp); box-shadow: var(--shadow-luxury); }
        }

        .deadline-pulse {
            animation: pulseBorder 2s infinite ease-in-out;
        }

        .task-left {
            display: flex;
            align-items: center;
            gap: 14px;
            flex: 1;
        }

        /* Elastic Checkbox */
        .elastic-checkbox {
            position: relative;
            cursor: pointer;
            display: block;
            width: 24px;
            height: 24px;
        }

        .elastic-checkbox input {
            position: absolute;
            opacity: 0;
            cursor: pointer;
            height: 0; width: 0;
        }

        .checkmark-disk {
            position: absolute;
            top: 0; left: 0;
            height: 24px; width: 24px;
            background-color: var(--input-bg);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: transparent;
            transition: all 0.3s var(--ease-premium);
        }

        .elastic-checkbox input:checked ~ .checkmark-disk {
            background-color: var(--text-primary);
            color: var(--bg-ambient);
            transform: scale(1.05);
        }

        .checkmark-disk svg {
            width: 12px;
            height: 12px;
            stroke-width: 3.5;
        }

        .task-detail-block {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .luxury-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1.4;
            transition: all 0.2s;
        }

        .completed .luxury-title {
            text-decoration: line-through;
            color: var(--text-secondary);
        }

        .badge-row {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .luxury-badge {
            font-size: 11px;
            font-weight: 600;
            background: var(--input-bg);
            color: var(--text-secondary);
            padding: 4px 8px;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .luxury-badge svg {
            opacity: 0.7;
        }

        .luxury-badge.deadline-alert {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
        }

        .card-control-group {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .control-trigger {
            border: none;
            background: transparent;
            width: 32px;
            height: 32px;
            border-radius: 10px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .control-trigger:hover {
            background: var(--input-bg);
            color: var(--text-primary);
        }

        .control-trigger.trash:hover {
            background: rgba(239, 68, 68, 0.08);
            color: var(--danger);
        }

        /* --- Dashboard --- */
        .luxury-dash-layout {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .architectural-card {
            background: var(--card-base);
            border: 1px solid var(--border-crisp);
            border-radius: 20px;
            padding: 20px;
            box-shadow: var(--shadow-luxury);
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: background-color 0.3s, border-color 0.3s;
        }

        .hero-segment {
            grid-column: span 2;
            gap: 14px;
        }

        .progress-micro-text {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .premium-progress-track {
            width: 100%;
            height: 6px;
            background: var(--input-bg);
            border-radius: 3px;
            overflow: hidden;
        }

        .premium-progress-bar {
            height: 100%;
            width: 0%;
            background: var(--text-primary);
            border-radius: 3px;
            transition: width 0.6s var(--ease-premium);
        }

        .dash-lbl {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .arch-value {
            font-size: 28px;
            font-weight: 700;
        }

        /* --- Calendar Panel --- */
        .immersive-calendar {
            background: var(--card-base);
            border: 1px solid var(--border-crisp);
            border-radius: 24px;
            padding: 20px;
            box-shadow: var(--shadow-luxury);
            margin-bottom: 24px;
            transition: background-color 0.3s, border-color 0.3s;
        }

        .cal-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            font-size: 16px;
            margin-bottom: 16px;
            padding: 0 4px;
        }

        .cal-matrix {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            text-align: center;
        }

        .cal-weekday {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-secondary);
            padding-bottom: 4px;
        }

        .cal-unit-day {
            aspect-ratio: 1;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
            background: var(--cal-day-bg);
        }

        .cal-unit-day:hover:not(.blank) {
            background: var(--border-crisp);
        }

        .cal-unit-day.blank {
            background: transparent;
            cursor: default;
        }

        .cal-unit-day.current {
            background: var(--accent-gold-light);
            color: var(--accent-gold);
        }

        .cal-unit-day.active-select {
            background: var(--text-primary) !important;
            color: var(--bg-ambient) !important;
        }

        .cal-dot {
            width: 4px;
            height: 4px;
            background: var(--accent-gold);
            border-radius: 50%;
            position: absolute;
            bottom: 4px;
        }

        .cal-unit-day.active-select .cal-dot {
            background: var(--bg-ambient);
        }

        .cal-dot.critical {
            background: var(--danger);
        }

        /* --- Navigation Dock --- */
        .omni-nav-dock {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 48px);
            max-width: 380px;
            background: rgba(10, 13, 20, 0.96);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 28px;
            padding: 6px;
            display: flex;
            justify-content: space-between;
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.4);
            z-index: 999;
        }

        [data-theme="dark"] .omni-nav-dock {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .dock-item {
            flex: 1;
            background: transparent;
            border: none;
            color: #94a3b8;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-family: inherit;
            font-size: 11px;
            font-weight: 600;
            padding: 10px 0;
            cursor: pointer;
            border-radius: 22px;
            transition: all 0.3s var(--ease-premium);
        }

        .dock-item svg {
            width: 18px;
            height: 18px;
            stroke-width: 2.2;
            transition: transform 0.3s var(--ease-premium);
        }

        .dock-item.active {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.15);
        }

        .dock-item.active svg {
            transform: translateY(-2px);
        }

        /* Empty State */
        .empty-lux-state {
            text-align: center;
            padding: 40px 20px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>

    <div class="app-container">
        <!-- Premium Header -->
        <header class="app-header">
            <div class="brand-space">
                <div class="brand-logo"><i data-lucide="activity" style="width: 18px; height: 18px;"></i></div>
                <span class="brand-name">Zenith</span>
            </div>
            <div class="header-controls">
                <div id="cancel-edit-btn" class="header-cancel-btn" onclick="cancelEdit()">
                    <i data-lucide="x" style="width:14px; height:14px;"></i> Cancel
                </div>
                <button class="theme-toggle-btn" onclick="toggleTheme()" title="Toggle Appearance">
                    <i id="theme-icon" data-lucide="moon" style="width: 18px; height: 18px;"></i>
                </button>
            </div>
        </header>

        <!-- Page 1: Tasks -->
        <div id="page-tasks" class="app-page active">
            
            <!-- Category Search Bar -->
            <div class="search-container">
                <i data-lucide="search" style="width: 18px; height: 18px;"></i>
                <input type="text" id="search-category" class="premium-input search-input" placeholder="Search by category..." oninput="renderTaskList()">
            </div>

            <!-- Creation Deck -->
            <div class="premium-input-deck">
                <div class="text-input-wrapper">
                    <input type="text" id="form-title" class="premium-input" placeholder="What is your next focus?">
                </div>
                <div class="form-split-row">
                    <input type="text" id="form-category" class="premium-input" placeholder="Category (e.g. Work, Life)">
                    <input type="date" id="form-date" class="premium-input">
                </div>
                <button class="premium-btn" id="main-submit-btn" onclick="handleFormSubmit()">
                    <i data-lucide="plus" style="width: 18px; height: 18px;"></i> <span>Create Task</span>
                </button>
            </div>

            <div style="display: flex; flex-direction: column; gap: 12px;" id="task-list-container"></div>
        </div>

        <!-- Page 2: Dashboard -->
        <div id="page-dashboard" class="app-page">
            <div class="luxury-dash-layout">
                <div class="architectural-card hero-segment">
                    <div class="progress-micro-text">
                        <span style="font-weight: 600; font-size: 15px;">Total Efficiency</span>
                        <span id="dash-percent" style="font-size: 26px; font-weight: 700;">0%</span>
                    </div>
                    <div class="premium-progress-track"><div id="dash-bar-fill" class="premium-progress-bar"></div></div>
                    <span id="dash-progress-text" style="font-size: 12px; color: var(--text-secondary);">0 of 0 completed</span>
                </div>

                <div class="architectural-card">
                    <span class="dash-lbl">All Focuses</span>
                    <span class="arch-value" id="dash-all-count">0</span>
                </div>

                <div class="architectural-card">
                    <span class="dash-lbl">Completed</span>
                    <span class="arch-value" id="dash-completed-count" style="color: var(--tint-fitness);">0</span>
                </div>

                <div class="architectural-card">
                    <span class="dash-lbl">Pending</span>
                    <span class="arch-value" id="dash-pending-count">0</span>
                </div>

                <div class="architectural-card" id="dash-card-deadline">
                    <span class="dash-lbl">Near Deadline</span>
                    <span class="arch-value" id="dash-deadline-count">0</span>
                </div>
            </div>
        </div>

        <!-- Page 3: Calendar -->
        <div id="page-calendar" class="app-page">
            <div class="immersive-calendar">
                <div class="cal-top-bar">
                    <span id="calendar-month-year">...</span>
                    <i data-lucide="calendar" style="width: 18px; height: 18px; color: var(--text-secondary);"></i>
                </div>
                <div class="cal-matrix" id="calendar-grid"></div>
            </div>
            
            <div style="display: flex; flex-direction: column; gap: 12px;">
                <span id="calendar-list-title" style="font-size: 13px; font-weight: 600; color: var(--text-secondary); padding-left: 4px;">Agenda</span>
                <div id="calendar-task-list" style="display: flex; flex-direction: column; gap: 12px;"></div>
            </div>
        </div>

        <!-- Omni Navigation Bar -->
        <nav class="omni-nav-dock">
            <button class="dock-item active" onclick="navigateTo('page-tasks', this)">
                <i data-lucide="compass"></i>Focus
            </button>
            <button class="dock-item" onclick="navigateTo('page-dashboard', this)">
                <i data-lucide="clover"></i>Insights
            </button>
            <button class="dock-item" onclick="navigateTo('page-calendar', this)">
                <i data-lucide="calendar-range"></i>Timeline
            </button>
        </nav>
    </div>

    <!-- CODE LOGIC ARCHITECTURE -->
    <script>
        const STORAGE_KEY = 'zenith_tasks_v2';
        let tasks = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        
        let editingTaskId = null;
        let selectedCalendarDate = null;

        function getTodayString() {
            const today = new Date();
            return `${today.getFullYear()}-${(today.getMonth() + 1).toString().padStart(2, '0')}-${today.getDate().toString().padStart(2, '0')}`;
        }
        
        if(tasks.length === 0) {
            tasks = [
                { id: 1, title: "ส่งแผนกลยุทธ์ FinTech ประจำปี", category: "Work", date: getFutureDateString(1), completed: false },
                { id: 2, title: "ชำระยอดบัตรเครดิตและกองทุน", category: "Finance", date: getFutureDateString(2), completed: false },
                { id: 3, title: "Cardio คุมอัตราการเต้นหัวใจ (Zone 2)", category: "Fitness", date: getTodayString(), completed: true }
            ];
            saveTasks();
        }
        
        selectedCalendarDate = getTodayString();
        document.getElementById('form-date').value = getTodayString();

        function getFutureDateString(daysToAdd) {
            const d = new Date();
            d.setDate(d.getDate() + daysToAdd);
            return `${d.getFullYear()}-${(d.getMonth() + 1).toString().padStart(2, '0')}-${d.getDate().toString().padStart(2, '0')}`;
        }

        function saveTasks() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
        }

        // --- Dark Mode Controller ---
        function initTheme() {
            const savedTheme = localStorage.getItem('zenith_theme');
            if (savedTheme) {
                document.documentElement.setAttribute('data-theme', savedTheme);
            } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
            updateThemeIcon();
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('zenith_theme', newTheme);
            updateThemeIcon();
        }

        function updateThemeIcon() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const iconEl = document.getElementById('theme-icon');
            if(currentTheme === 'dark') {
                iconEl.setAttribute('data-lucide', 'sun');
            } else {
                iconEl.setAttribute('data-lucide', 'moon');
            }
            lucide.createIcons();
        }

        function isNearDeadline(taskDateStr, isCompleted) {
            if (isCompleted || !taskDateStr) return false;
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            
            const [y, m, d] = taskDateStr.split('-');
            const taskDate = new Date(y, m - 1, d);
            taskDate.setHours(0, 0, 0, 0);
            
            const timeDiff = taskDate.getTime() - today.getTime();
            const daysDiff = Math.ceil(timeDiff / (1000 * 3600 * 24));
            return daysDiff >= 0 && daysDiff <= 2; 
        }

        // Fluid Page Navigation
        function navigateTo(pageId, element) {
            const currentActivePage = document.querySelector('.app-page.active');
            const targetPage = document.getElementById(pageId);
            
            if (currentActivePage) {
                currentActivePage.style.opacity = '0';
                currentActivePage.style.transform = 'translateY(12px) scale(0.98)';
                setTimeout(() => {
                    currentActivePage.classList.remove('active');
                    executePageShow(targetPage, pageId, element);
                }, 200);
            } else {
                executePageShow(targetPage, pageId, element);
            }
        }

        function executePageShow(targetPage, pageId, element) {
            document.querySelectorAll('.dock-item').forEach(item => item.classList.remove('active'));
            element.classList.add('active');
            
            targetPage.classList.add('active');
            targetPage.offsetHeight; 
            targetPage.style.opacity = '1';
            targetPage.style.transform = 'translateY(0) scale(1)';
            
            if (pageId === 'page-calendar') renderCalendar();
            if (pageId === 'page-dashboard') updateDashboardStats();
            if (pageId === 'page-tasks') renderTaskList();
        }

        // Render Cards with Filter Capability
        function renderTaskList() {
            const container = document.getElementById('task-list-container');
            const searchQuery = document.getElementById('search-category').value.trim().toLowerCase();
            container.innerHTML = '';

            // Filter tasks based on Category Search
            const filteredData = tasks.filter(task => {
                if (!searchQuery) return true;
                return task.category && task.category.toLowerCase().includes(searchQuery);
            });

            if(filteredData.length === 0) {
                container.innerHTML = `<div class="empty-lux-state"><i data-lucide="wind" style="width:32px; height:32px; stroke-width:1.5; margin-bottom:8px;"></i><br>No matching strategies found.</div>`;
                lucide.createIcons();
                return;
            }

            const sortedTasks = [...filteredData].sort((a, b) => {
                if (a.completed !== b.completed) return a.completed ? 1 : -1;
                return new Date(a.date) - new Date(b.date);
            });

            sortedTasks.forEach((task) => {
                const urgent = isNearDeadline(task.date, task.completed);
                const card = document.createElement('div');
                card.className = `task-card-luxury ${task.completed ? 'completed' : ''} ${urgent ? 'deadline-pulse' : ''}`;
                card.setAttribute('data-id', task.id);
                
                card.innerHTML = `
                    <div class="task-left">
                        <label class="elastic-checkbox">
                            <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${task.id})">
                            <span class="checkmark-disk"><i data-lucide="check"></i></span>
                        </label>
                        <div class="task-detail-block">
                            <span class="luxury-title">${escapeHtml(task.title)}</span>
                            <div class="badge-row">
                                <span class="luxury-badge category-tag">${escapeHtml(task.category || 'General')}</span>
                                <span class="luxury-badge"><i data-lucide="calendar" style="width:10px; height:10px;"></i>${task.date}</span>
                                <span class="luxury-badge deadline-alert" style="display: ${urgent ? 'inline-flex' : 'none'}">Urgent</span>
                            </div>
                        </div>
                    </div>
                    <div class="card-control-group">
                        <button class="control-trigger" onclick="startEditTask(${task.id})"><i data-lucide="sliders-horizontal" style="width:15px; height:15px;"></i></button>
                        <button class="control-trigger trash" onclick="deleteTask(${task.id})"><i data-lucide="cross" style="width:15px; height:15px; transform:rotate(45deg);"></i></button>
                    </div>
                `;
                container.appendChild(card);
            });
            lucide.createIcons();
        }

        function toggleTask(id) {
            const task = tasks.find(t => t.id === id);
            if(!task) return;
            task.completed = !task.completed;
            saveTasks();

            document.querySelectorAll(`.task-card-luxury[data-id="${id}"]`).forEach(card => {
                const isCompleted = task.completed;
                card.classList.toggle('completed', isCompleted);
                
                const chk = card.querySelector('input[type="checkbox"]');
                if(chk) chk.checked = isCompleted;
                
                if(isCompleted) card.classList.remove('deadline-pulse');
            });

            updateDashboardStats();
        }

        function handleFormSubmit() {
            const titleInput = document.getElementById('form-title');
            const catInput = document.getElementById('form-category');
            const dateInput = document.getElementById('form-date');

            if(!titleInput.value.trim() || !dateInput.value) return;

            const finalCategory = catInput.value.trim() || "General";

            if(editingTaskId) {
                const index = tasks.findIndex(t => t.id === editingTaskId);
                if(index > -1) {
                    tasks[index].title = titleInput.value.trim();
                    tasks[index].category = finalCategory;
                    tasks[index].date = dateInput.value;
                }
                cancelEdit();
            } else {
                tasks.push({
                    id: Date.now(),
                    title: titleInput.value.trim(),
                    category: finalCategory,
                    date: dateInput.value,
                    completed: false
                });
                titleInput.value = '';
                catInput.value = '';
            }

            saveTasks();
            renderTaskList();
            updateDashboardStats();
        }

        function startEditTask(id) {
            const task = tasks.find(t => t.id === id);
            if(!task) return;

            editingTaskId = id;
            document.getElementById('form-title').value = task.title;
            document.getElementById('form-category').value = task.category;
            document.getElementById('form-date').value = task.date;

            const btn = document.getElementById('main-submit-btn');
            btn.classList.add('edit-mode-active');
            btn.innerHTML = `<i data-lucide="check" style="width: 18px; height: 18px;"></i> <span>Update Strategy</span>`;
            document.getElementById('cancel-edit-btn').style.display = 'flex';
            
            navigateTo('page-tasks', document.querySelector('.dock-item:nth-child(1)'));
            lucide.createIcons();
        }

        function cancelEdit() {
            editingTaskId = null;
            document.getElementById('form-title').value = '';
            document.getElementById('form-category').value = '';
            document.getElementById('form-date').value = getTodayString();
            
            const btn = document.getElementById('main-submit-btn');
            btn.classList.remove('edit-mode-active');
            btn.innerHTML = `<i data-lucide="plus" style="width: 18px; height: 18px;"></i> <span>Create Task</span>`;
            document.getElementById('cancel-edit-btn').style.display = 'none';
            lucide.createIcons();
        }

        function deleteTask(id) {
            const card = document.querySelector(`.task-card-luxury[data-id="${id}"]`);
            if(card) {
                card.style.opacity = '0';
                card.style.transform = 'scale(0.9) translateY(10px)';
                setTimeout(() => {
                    tasks = tasks.filter(t => t.id !== id);
                    saveTasks();
                    renderTaskList();
                    updateDashboardStats();
                }, 300);
            }
        }

        function updateDashboardStats() {
            const total = tasks.length;
            const completed = tasks.filter(t => t.completed).length;
            const pending = total - completed;
            const deadlineCount = tasks.filter(t => isNearDeadline(t.date, t.completed)).length;
            const percent = total > 0 ? Math.round((completed / total) * 100) : 0;

            const percentEl = document.getElementById('dash-percent');
            if(percentEl) percentEl.innerText = `${percent}%`;
            
            const barFill = document.getElementById('dash-bar-fill');
            if(barFill) barFill.style.width = `${percent}%`;
            
            const progressTxt = document.getElementById('dash-progress-text');
            if(progressTxt) progressTxt.innerText = `${completed} of ${total} goals finalized`;
            
            document.getElementById('dash-all-count').innerText = total;
            document.getElementById('dash-completed-count').innerText = completed;
            document.getElementById('dash-pending-count').innerText = pending;
            
            const deadCountEl = document.getElementById('dash-deadline-count');
            deadCountEl.innerText = deadlineCount;
            
            const deadCard = document.getElementById('dash-card-deadline');
            if(deadlineCount > 0) {
                deadCard.style.borderColor = 'rgba(255,59,48,0.3)';
                deadCountEl.style.color = 'var(--danger)';
            } else {
                deadCard.style.borderColor = 'var(--border-crisp)';
                deadCountEl.style.color = 'var(--text-primary)';
            }
        }

        // Architectural Calendar Core
        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';

            const now = new Date();
            const currentYear = now.getFullYear();
            const currentMonth = now.getMonth(); 

            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            document.getElementById('calendar-month-year').innerText = `${monthNames[currentMonth]} ${currentYear}`;

            const dayNames = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
            dayNames.forEach(d => {
                const h = document.createElement('div');
                h.className = 'cal-weekday';
                h.innerText = d;
                grid.appendChild(h);
            });

            const firstDayOfMonth = new Date(currentYear, currentMonth, 1).getDay();
            for(let i = 0; i < firstDayOfMonth; i++) {
                const empty = document.createElement('div');
                empty.className = 'cal-unit-day blank';
                grid.appendChild(empty);
            }

            const totalDaysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
            const todayStr = getTodayString();

            for(let day = 1; day <= totalDaysInMonth; day++) {
                const dateString = `${currentYear}-${(currentMonth + 1).toString().padStart(2, '0')}-${day.toString().padStart(2, '0')}`;
                const dayEl = document.createElement('div');
                dayEl.className = 'cal-unit-day';
                dayEl.innerText = day;
                dayEl.setAttribute('data-date', dateString);

                if(dateString === todayStr) dayEl.classList.add('current');
                if(dateString === selectedCalendarDate) dayEl.classList.add('active-select');

                dayEl.onclick = () => {
                    document.querySelectorAll('.cal-unit-day').forEach(el => el.classList.remove('active-select'));
                    dayEl.classList.add('active-select');
                    selectedCalendarDate = dateString;
                    renderCalendarTaskList(dateString);
                };

                grid.appendChild(dayEl);
            }
            
            updateCalendarDotsOnly();
            renderCalendarTaskList(selectedCalendarDate);
        }

        function updateCalendarDotsOnly() {
            document.querySelectorAll('.cal-unit-day[data-date]').forEach(dayEl => {
                const dateString = dayEl.getAttribute('data-date');
                const dayTasks = tasks.filter(t => t.date === dateString);
                
                const oldDot = dayEl.querySelector('.cal-dot');
                if(oldDot) oldDot.remove();

                if(dayTasks.length > 0) {
                    const hasUrgent = dayTasks.some(t => isNearDeadline(t.date, t.completed));
                    const dot = document.createElement('div');
                    dot.className = `cal-dot ${hasUrgent ? 'critical' : ''}`;
                    dayEl.appendChild(dot);
                }
            });
        }

        function renderCalendarTaskList(dateString) {
            const listCalContainer = document.getElementById('calendar-task-list');
            const title = document.getElementById('calendar-list-title');
            listCalContainer.innerHTML = '';
            
            const [y, m, d] = dateString.split('-');
            title.innerText = `Agenda — ${parseInt(d)}/${parseInt(m)}/${y}`;

            const filteredTasks = tasks.filter(t => t.date === dateString);
            if(filteredTasks.length === 0) {
                listCalContainer.innerHTML = `<div class="empty-lux-state">No strategy planned for this date.</div>`;
                return;
            }

            filteredTasks.forEach(task => {
                const item = document.createElement('div');
                item.className = `task-card-luxury ${task.completed ? 'completed' : ''}`;
                item.style.padding = '14px 18px';
                
                item.innerHTML = `
                    <div class="task-left">
                        <label class="elastic-checkbox">
                            <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${task.id}); renderCalendarTaskList('${dateString}');">
                            <span class="checkmark-disk"><i data-lucide="check"></i></span>
                        </label>
                        <span class="luxury-title" style="font-size:14px;">${escapeHtml(task.title)}</span>
                    </div>
                `;
                listCalContainer.appendChild(item);
            });
            lucide.createIcons();
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // Init Stage
        initTheme();
        renderTaskList();
        updateDashboardStats();
        lucide.createIcons();
    </script>
</body>
</html>
