<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEO_VAULT V3.0 // Spatial Edition</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            /* Color Palette: Dark Mode + Neon Purple */
            --bg-base: #05030a;
            --accent-purple: #b026ff;
            --accent-purple-glow: rgba(176, 38, 255, 0.4);
            --accent-pink: #ff26b0;
            --text-light: #f8f6fb;
            --text-gray: #8a849b;
            
            /* Glassmorphism */
            --glass-bg: rgba(20, 15, 30, 0.4);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-highlight: rgba(255, 255, 255, 0.15);
            --glass-blur: blur(28px);
            
            --transition-smooth: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-light);
            height: 100dvh; 
            display: flex; flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Ambient Background Lights */
        .ambient-light {
            position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.5; z-index: -1; animation: float 15s infinite ease-in-out alternate;
        }
        .light-1 { width: 40vw; height: 40vw; background: var(--accent-purple); top: -10%; left: -10%; }
        .light-2 { width: 35vw; height: 35vw; background: #3b00ff; bottom: -10%; right: -5%; animation-delay: -5s; }
        .light-3 { width: 25vw; height: 25vw; background: var(--accent-pink); top: 40%; left: 40%; opacity: 0.3; animation-delay: -10s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 30px) scale(1.1); }
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(176, 38, 255, 0.3); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-purple); }

        /* --- FLOATING NAVIGATION --- */
        nav {
            display: flex; justify-content: space-between; align-items: center;
            margin: 15px 20px; padding: 12px 20px;
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-top: 1px solid var(--glass-highlight); /* Specular Highlight */
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            z-index: 10;
            transition: var(--transition-smooth);
        }

        /* Typewriter Animation */
        .brand { 
            font-weight: 700; font-size: 1.2rem; letter-spacing: 2px; 
            display: flex; align-items: center; gap: 10px;
        }
        .brand i { color: var(--accent-purple); text-shadow: 0 0 15px var(--accent-purple); }
        .typewriter-text {
            display: inline-block;
            overflow: hidden; white-space: nowrap;
            border-right: 2px solid var(--accent-purple);
            animation: typing 2s steps(20, end) forwards, blink 0.75s step-end infinite;
            width: 0;
        }

        @keyframes typing { to { width: 108px; } } /* Adjusted to fit "NEO_VAULT" */
        @keyframes blink { 50% { border-color: transparent; } }

        .mode-switcher { display: flex; background: rgba(0, 0, 0, 0.3); padding: 4px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.05); }
        .mode-btn { background: transparent; border: none; color: var(--text-gray); padding: 8px 16px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 0.85rem; transition: var(--transition-smooth); }
        .mode-btn.active { color: #fff; background: rgba(176, 38, 255, 0.2); box-shadow: 0 0 15px rgba(176, 38, 255, 0.2); border: 1px solid rgba(176, 38, 255, 0.4); }

        .view-switcher { display: none; }

        /* --- FLOATING ARCHITECTURE (WIDGETS) --- */
        .main-layout {
            display: grid;
            grid-template-columns: 320px 1fr 1fr;
            gap: 20px; padding: 0 20px 20px 20px;
            flex: 1; height: calc(100dvh - 90px);
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-top: 1px solid var(--glass-highlight);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            display: flex; flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Sidebar */
        .sidebar { padding: 1.5rem; gap: 1.2rem; }
        .sidebar-controls { display: flex; gap: 10px; flex-shrink: 0; }
        
        .search-container { position: relative; flex-shrink: 0; }
        .search-container input { width: 100%; background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255,255,255,0.1); color: var(--text-light); padding: 10px 15px 10px 38px; border-radius: 12px; outline: none; transition: var(--transition-smooth); }
        .search-container input:focus { border-color: var(--accent-purple); background: rgba(176, 38, 255, 0.05); box-shadow: 0 0 10px rgba(176, 38, 255, 0.1); }
        .search-container i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-gray); }

        .action-btn { background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink)); color: white; border: none; padding: 12px; border-radius: 14px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 15px var(--accent-purple-glow); transition: var(--transition-smooth); flex: 1; }
        .action-btn:active { transform: scale(0.95); }

        .list-container { display: flex; flex-direction: column; gap: 12px; overflow-y: auto; padding-right: 4px; }
        .snippet-card { background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.05); padding: 1.2rem; border-radius: 16px; cursor: pointer; transition: var(--transition-smooth); }
        .snippet-card:hover { background: rgba(255,255,255,0.05); transform: translateY(-2px); }
        .snippet-card.active { border-color: var(--accent-purple); background: rgba(176, 38, 255, 0.1); box-shadow: 0 4px 20px rgba(176, 38, 255, 0.15); }
        .snippet-card h5 { font-size: 0.95rem; margin-bottom: 6px; color: var(--text-light); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .snippet-card p { font-size: 0.8rem; color: var(--text-gray); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Editor */
        .zone-header { padding: 1rem 1.5rem; background: rgba(0,0,0,0.2); border-bottom: 1px solid var(--glass-border); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .zone-header input { background: transparent; border: none; color: white; font-weight: 600; font-size: 1.1rem; width: 100%; outline: none; }
        
        .code-area { flex: 1; background: transparent; border: none; resize: none; outline: none; padding: 1.5rem; color: #e2d9f3; font-family: 'Fira Code', monospace; line-height: 1.7; font-size: 15px; tab-size: 2; }

        /* Preview */
        .preview-header { padding: 1rem 1.5rem; background: rgba(0,0,0,0.2); border-bottom: 1px solid var(--glass-border); display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; font-weight: 700; letter-spacing: 1.5px; color: var(--text-gray); }
        .preview-header .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent-purple); box-shadow: 0 0 10px var(--accent-purple); margin-right: 8px; }
        
        .iframe-wrapper { flex: 1; padding: 10px; display: flex; }
        iframe { flex: 1; background: #fff; border: none; border-radius: 14px; } /* Slightly rounded iframe */

        /* Buttons & Magnetic Effect */
        .ctrl-btns { display: flex; gap: 10px; }
        .icon-btn { 
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: var(--text-light); 
            width: 40px; height: 40px; border-radius: 12px; cursor: pointer; 
            display: flex; align-items: center; justify-content: center; 
            transition: background 0.3s, color 0.3s, border 0.3s; /* Transform is handled by JS for magnetic effect */
            will-change: transform;
        }
        .icon-btn:hover { background: rgba(176, 38, 255, 0.2); border-color: rgba(176, 38, 255, 0.4); color: #fff; }

        /* Fullscreen modifications */
        body.fullscreen-mode nav { margin-top: -100px; opacity: 0; }
        body.fullscreen-mode .main-layout { height: 100dvh; padding: 15px; grid-template-columns: 0px 0px 1fr; gap: 0; }
        body.fullscreen-mode .sidebar, body.fullscreen-mode .editor-zone { display: none; }
        body.fullscreen-mode .preview-zone { border-radius: 30px; }

        /* --- MEDIA QUERY แก้ไขจุดบั๊กจอเล็กตรงนี้เรียบร้อยแล้ว --- */
        @media (max-width: 900px) {
            nav { flex-wrap: wrap; border-radius: 16px; margin: 10px; }
            .brand { width: 100%; justify-content: center; margin-bottom: 10px; }
            .view-switcher { display: flex; width: 100%; gap: 5px; margin-top: 10px; background: rgba(0,0,0,0.3); padding: 5px; border-radius: 14px; }
            .switch-btn { flex: 1; background: transparent; border: none; color: var(--text-gray); padding: 8px; border-radius: 10px; font-weight: 600; }
            .switch-btn.active { background: rgba(176, 38, 255, 0.2); color: white; border: 1px solid rgba(176, 38, 255, 0.4); }
            
            .main-layout { grid-template-columns: 1fr; padding: 0 10px 10px 10px; position: relative; height: calc(100dvh - 140px); }
            
            /* แก้ไขให้จัดตำแหน่งจุดเริ่มต้นซ้าย (left: 10px) เพื่อให้สมมาตรเท่ากันทั้งสองข้าง */
            .glass-panel { 
                position: absolute; 
                left: 10px;
                width: calc(100% - 20px); 
                height: calc(100% - 10px); 
                opacity: 0; 
                pointer-events: none; 
                transform: scale(0.95); 
                transition: var(--transition-smooth); 
            }
            
            .main-layout.show-list .sidebar,
            .main-layout.show-editor .editor-zone,
            .main-layout.show-preview .preview-zone {
                opacity: 1; pointer-events: auto; transform: scale(1); z-index: 5;
            }
        }
    </style>
</head>
<body>

    <!-- Ambient Lights -->
    <div class="ambient-light light-1"></div>
    <div class="ambient-light light-2"></div>
    <div class="ambient-light light-3"></div>

    <!-- NAV BAR -->
    <nav>
        <div class="brand"><i class="fa-solid fa-layer-group"></i> <span class="typewriter-text">NEO_VAULT</span></div>
        
        <div class="mode-switcher">
            <button class="mode-btn active magnetic" id="mode-code" onclick="switchSystemMode('code')">CODE</button>
            <button class="mode-btn magnetic" id="mode-prompt" onclick="switchSystemMode('prompt')">PROMPT</button>
        </div>

        <div class="view-switcher">
            <button class="switch-btn active" id="btn-list" onclick="switchMobileView('list')">Vault</button>
            <button class="switch-btn" id="btn-editor" onclick="switchMobileView('editor')">Editor</button>
            <button class="switch-btn" id="btn-preview" onclick="switchMobileView('preview')">View</button>
        </div>
    </nav>

    <!-- MAIN INTERFACE -->
    <div class="main-layout show-list" id="mainLayout">
        
        <aside class="glass-panel sidebar">
            <div class="sidebar-controls">
                <button class="action-btn magnetic" id="actionBtn" onclick="addNewItem()"><i class="fa-solid fa-plus"></i> New</button>
                <button class="icon-btn magnetic" onclick="exportData()" title="Backup"><i class="fa-solid fa-file-export"></i></button>
                <button class="icon-btn magnetic" onclick="document.getElementById('importFile').click()" title="Restore"><i class="fa-solid fa-file-import"></i></button>
                <input type="file" id="importFile" style="display:none" onchange="importData(event)" accept=".json">
            </div>
            
            <div class="search-container">
                <i class="fa-solid fa-search"></i>
                <input type="text" id="searchInput" placeholder="Search title or content...">
            </div>

            <div class="list-container" id="listContainer"></div>
        </aside>

        <section class="glass-panel editor-zone">
            <div class="zone-header">
                <input type="text" id="titleInput" value="Untitled">
                <div class="ctrl-btns">
                    <button class="icon-btn magnetic" id="templateBtn" onclick="insertTemplate()" title="Template"><i class="fa-solid fa-code"></i></button>
                    <button class="icon-btn magnetic" id="copyBtn" onclick="copyToClipboard()" title="Copy"><i class="fa-solid fa-copy"></i></button>
                    <button class="icon-btn magnetic" onclick="deleteCurrentItem()" title="Delete" style="color: #ff4545;"><i class="fa-solid fa-trash"></i></button>
                </div>
            </div>
            <textarea class="code-area" id="editor" placeholder="Start typing..."></textarea>
        </section>

        <section class="glass-panel preview-zone">
            <div class="preview-header">
                <div><span class="dot"></span> <span id="previewLabel">LIVE OUTPUT</span></div>
                <div style="display: flex; align-items: center; gap: 15px;">
                    <div id="saveStatus" style="color: var(--accent-purple); font-size: 0.75rem;">Saved</div>
                    <button class="icon-btn magnetic" id="fullscreenBtn" onclick="toggleFullscreen()" style="width:32px; height:32px;"><i class="fa-solid fa-expand"></i></button>
                </div>
            </div>
            <div class="iframe-wrapper">
                <iframe id="outputFrame" sandbox="allow-scripts"></iframe>
            </div>
        </section>

    </div>

    <!-- LOGIC ENGINE -->
    <script>
        const defaultCodeData = [{ id: 101, title: "Neon Glass Button", code: "<style>\n  body { background: #0a0a0a; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; }\n  .btn { background: rgba(176, 38, 255, 0.1); border: 1px solid rgba(176, 38, 255, 0.5); color: #fff; padding: 15px 30px; border-radius: 12px; font-size: 16px; cursor: pointer; backdrop-filter: blur(10px); box-shadow: 0 0 20px rgba(176, 38, 255, 0.2); transition: all 0.3s; }\n  .btn:hover { background: rgba(176, 38, 255, 0.3); box-shadow: 0 0 30px rgba(176, 38, 255, 0.5); transform: translateY(-2px); }\n</style>\n<button class=\"btn\">Hover Me</button>" }];
        const defaultPromptData = [{ id: 201, title: "Cyberpunk Story Generator", code: "คุณคือ AI นักแต่งนิยาย Sci-Fi\n\nโจทย์: สร้างพล็อตเรื่องสั้นเกี่ยวกับแฮกเกอร์ที่ค้นพบความลับในระบบของรัฐบาล\nMood & Tone: มืดมน, ฝนตก, นีออน, ลุ้นระทึก" }];

        let currentMode = 'code', storage = [], activeId = null, isFullscreen = false, debounceTimer;

        /* --- MAGNETIC BUTTON EFFECT --- */
        function initMagneticButtons() {
            document.querySelectorAll('.magnetic').forEach(btn => {
                btn.addEventListener('mousemove', (e) => {
                    const rect = btn.getBoundingClientRect();
                    const x = e.clientX - rect.left - rect.width / 2;
                    const y = e.clientY - rect.top - rect.height / 2;
                    btn.style.transform = `translate(${x * 0.3}px, ${y * 0.3}px)`;
                    btn.style.transition = 'none';
                });
                btn.addEventListener('mouseleave', () => {
                    btn.style.transition = 'transform 0.4s cubic-bezier(0.16, 1, 0.3, 1)';
                    btn.style.transform = `translate(0px, 0px)`;
                });
            });
        }

        // Initialize System
        function initSystemMode() {
            const key = currentMode === 'code' ? 'neo_vault_v3_code' : 'neo_vault_v3_prompt';
            storage = JSON.parse(localStorage.getItem(key)) || (currentMode === 'code' ? defaultCodeData : defaultPromptData);
            activeId = storage.length > 0 ? storage[0].id : Date.now();
            
            document.getElementById('actionBtn').innerHTML = currentMode === 'code' ? `<i class="fa-solid fa-plus"></i> Code` : `<i class="fa-solid fa-plus"></i> Prompt`;
            document.getElementById('editor').style.fontFamily = currentMode === 'code' ? "'Fira Code', monospace" : "'Plus Jakarta Sans', sans-serif";
            document.getElementById('previewLabel').innerText = currentMode === 'code' ? `WEB PREVIEW` : `PROMPT VIEW`;
            
            document.getElementById('searchInput').value = '';
            renderSidebar();
            selectItem(activeId);
        }

        function switchSystemMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`mode-${mode}`).classList.add('active');
            initSystemMode();
        }

        document.getElementById('searchInput').addEventListener('input', (e) => renderSidebar(e.target.value));

        function renderSidebar(filterText = '') {
            const container = document.getElementById('listContainer');
            container.innerHTML = '';
            const lowerFilter = filterText.toLowerCase();

            const filtered = storage.filter(item => (item.title && item.title.toLowerCase().includes(lowerFilter)) || (item.code && item.code.toLowerCase().includes(lowerFilter)));

            if (!filtered.length) return container.innerHTML = `<p style="text-align:center; color:var(--text-gray); margin-top:20px; font-size:0.9rem;">No data.</p>`;

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = `snippet-card ${item.id === activeId ? 'active' : ''}`;
                card.onclick = () => selectItem(item.id);
                const cleanPreview = (item.code || "").replace(/</g, "&lt;").substring(0, 40);
                card.innerHTML = `<h5>${item.title || 'Untitled'}</h5><p>${cleanPreview || '...'}</p>`;
                container.appendChild(card);
            });
        }

        function selectItem(id) {
            activeId = id;
            const current = storage.find(i => i.id === id);
            if(current) {
                document.getElementById('titleInput').value = current.title;
                document.getElementById('editor').value = current.code;
                liveRender();
                renderSidebar(document.getElementById('searchInput').value);
            }
            if(window.innerWidth <= 900) switchMobileView('editor');
        }

        function handleInputActivity() {
            const statusNode = document.getElementById('saveStatus');
            statusNode.innerText = "Typing...";
            statusNode.style.color = "var(--text-gray)";

            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                saveCurrentData();
                liveRender();
            }, 600);
        }

        document.getElementById('editor').addEventListener('input', handleInputActivity);
        document.getElementById('titleInput').addEventListener('input', handleInputActivity);

        document.getElementById('editor').addEventListener('keydown', function(e) {
            if (e.key === 'Tab') {
                e.preventDefault();
                const start = this.selectionStart, end = this.selectionEnd;
                this.value = this.value.substring(0, start) + "  " + this.value.substring(end);
                this.selectionStart = this.selectionEnd = start + 2;
                handleInputActivity();
            }
        });

        function liveRender() {
            const code = document.getElementById('editor').value;
            const iframe = document.getElementById('outputFrame');
            
            if (currentMode === 'code') { iframe.srcdoc = code; } 
            else {
                iframe.srcdoc = `
                    <!DOCTYPE html><html><head><style>
                        body { background: #0c0814; color: #f8f6fb; font-family: system-ui; padding: 20px; line-height: 1.6; }
                        .box { border: 1px solid rgba(176,38,255,0.2); padding: 20px; background: rgba(176,38,255,0.05); border-radius: 16px; white-space: pre-wrap; word-wrap: break-word; }
                        .tag { display: inline-block; background: var(--accent-purple); color: white; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; margin-bottom: 15px; }
                    </style></head><body>
                        <div class="tag">PROMPT</div>
                        <div class="box">${code ? code.replace(/</g, "&lt;").replace(/>/g, "&gt;") : 'Empty...'}</div>
                    </body></html>`;
            }
        }

        function saveCurrentData() {
            const current = storage.find(i => i.id === activeId);
            if(current) {
                current.title = document.getElementById('titleInput').value;
                current.code = document.getElementById('editor').value;
                updateLocalStorage();
                renderSidebar(document.getElementById('searchInput').value);
            }
        }

        function updateLocalStorage() {
            const key = currentMode === 'code' ? 'neo_vault_v3_code' : 'neo_vault_v3_prompt';
            const statusNode = document.getElementById('saveStatus');
            try {
                localStorage.setItem(key, JSON.stringify(storage));
                statusNode.innerText = "Saved"; statusNode.style.color = "var(--accent-purple)";
            } catch (e) {
                statusNode.innerText = "Storage Full!"; statusNode.style.color = "#ff4545";
                alert("⚠️ LocalStorage is full!");
            }
        }

        function addNewItem() {
            const newId = Date.now();
            storage.unshift({ id: newId, title: "Untitled", code: "" });
            activeId = newId; updateLocalStorage();
            document.getElementById('searchInput').value = '';
            renderSidebar(); selectItem(newId);
            document.getElementById('editor').focus();
        }

        function deleteCurrentItem() {
            if(storage.length <= 1) return alert("Cannot delete the last item.");
            if(!confirm("Delete this item?")) return;
            storage = storage.filter(i => i.id !== activeId);
            activeId = storage[0].id; updateLocalStorage(); selectItem(activeId);
        }

        function insertTemplate() {
            document.getElementById('editor').value = currentMode === 'code' 
                ? `<!DOCTYPE html>\n<style>\n  body { font-family: sans-serif; padding: 20px; }\n</style>\n<body>\n  <h2>Hello World</h2>\n</body>`
                : `[Role]: ...\n[Task]: ...\n[Format]: ...`;
            handleInputActivity();
        }

        function copyToClipboard() {
            navigator.clipboard.writeText(document.getElementById('editor').value).then(() => {
                const btn = document.getElementById('copyBtn');
                btn.innerHTML = '<i class="fa-solid fa-check"></i>';
                setTimeout(() => btn.innerHTML = '<i class="fa-solid fa-copy"></i>', 1500);
            });
        }

        function exportData() {
            const blob = new Blob([JSON.stringify(storage, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `NeoVault_V3_${currentMode}_${Date.now()}.json`;
            a.click();
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = e => {
                try {
                    const imported = JSON.parse(e.target.result);
                    if(Array.isArray(imported)) {
                        storage = imported; updateLocalStorage();
                        document.getElementById('searchInput').value = '';
                        renderSidebar(); selectItem(storage[0].id);
                    }
                } catch(err) { alert("Invalid file."); }
                event.target.value = '';
            };
            reader.readAsText(file);
        }

        function switchMobileView(viewName) {
            const layout = document.getElementById('mainLayout');
            layout.className = 'main-layout';
            layout.classList.add(`show-${viewName}`);
            document.querySelectorAll('.switch-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${viewName}`).classList.add('active');
        }

        function toggleFullscreen() {
            isFullscreen = !isFullscreen;
            document.body.classList.toggle('fullscreen-mode');
            const btn = document.getElementById('fullscreenBtn');
            btn.innerHTML = isFullscreen ? '<i class="fa-solid fa-compress"></i>' : '<i class="fa-solid fa-expand"></i>';
        }

        window.onload = () => {
            initSystemMode();
            initMagneticButtons();
        };
    </script>
</body>
</html>
