<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NEO_VAULT">
    <meta name="theme-color" content="#06080c">

    <title>NEO_VAULT V2.1 // Fullscreen Preview</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #06080c;
            --panel-bg: rgba(10, 16, 16, 0.7);
            --accent-green: #00ff66;
            --accent-green-glow: rgba(0, 255, 102, 0.35);
            --accent-emerald: #00b34a;
            --text-light: #f0f5f2;
            --text-gray: #6b7a70;
            --border: rgba(0, 255, 102, 0.15);
            --transition-smooth: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(at 0% 0%, rgba(0, 255, 102, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(0, 179, 74, 0.05) 0px, transparent 50%);
            color: var(--text-light);
            height: 100dvh; 
            display: flex;
            flex-direction: column;
            overflow: hidden;
            overscroll-behavior: none;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.3); }
        ::-webkit-scrollbar-thumb { background: rgba(0, 255, 102, 0.2); border-radius: 10px; transition: var(--transition-smooth); }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-green); }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 8px rgba(0, 255, 102, 0.4); }
            50% { box-shadow: 0 0 18px rgba(0, 255, 102, 0.7); }
            100% { box-shadow: 0 0 8px rgba(0, 255, 102, 0.4); }
        }

        /* --- NAVIGATION BAR --- */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            background: rgba(6, 12, 9, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            z-index: 10;
            gap: 15px;
            padding-top: env(safe-area-inset-top, 1rem); 
            /* เพิ่ม Transition เพื่อให้สไลด์ขึ้นได้นุ่มนวล */
            transition: var(--transition-smooth);
            transform: translateY(0);
            transform-origin: top;
        }

        /* 🟢 FULLSCREEN MODE CSS (ระบบซ่อนแถบเมนู) 🟢 */
        body.fullscreen-mode nav {
            transform: translateY(-100%);
            height: 0 !important;
            padding-top: 0 !important;
            padding-bottom: 0 !important;
            margin: 0 !important;
            opacity: 0;
            border-bottom: none;
            pointer-events: none;
        }
        body.fullscreen-mode .main-layout {
            height: 100dvh !important;
        }
        /* ดันขอบ Header ลงมานิดนึงในโหมดเต็มจอ เพื่อหลบกล้อง/รอยแหว่ง iPhone */
        body.fullscreen-mode .preview-header {
            padding-top: calc(env(safe-area-inset-top, 1rem) + 0.5rem);
        }

        .brand {
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: 1.2px;
            color: var(--text-light);
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }
        .brand i { color: var(--accent-green); animation: pulseGlow 3s infinite; border-radius: 50%; }
        .brand span { color: var(--accent-emerald); }

        .mode-switcher { display: flex; background: rgba(0, 0, 0, 0.4); padding: 4px; border-radius: 12px; border: 1px solid var(--border); gap: 4px; }
        .mode-btn { background: transparent; border: none; color: var(--text-gray); padding: 10px 16px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 0.85rem; transition: var(--transition-smooth); display: flex; align-items: center; gap: 8px; }
        .mode-btn.active { color: var(--accent-green); background: rgba(0, 255, 102, 0.08); border: 1px solid rgba(0, 255, 102, 0.2); }

        .view-switcher { display: none; background: rgba(255, 255, 255, 0.02); padding: 4px; border-radius: 12px; border: 1px solid var(--border); gap: 2px; margin-bottom: env(safe-area-inset-bottom, 0); }
        .switch-btn { background: transparent; border: none; color: var(--text-gray); padding: 10px 16px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 0.85rem; transition: var(--transition-smooth); white-space: nowrap; }
        .switch-btn.active { color: #000; background: var(--accent-green); box-shadow: 0 4px 15px var(--accent-green-glow); font-weight: 700; }

        .main-layout {
            display: grid;
            grid-template-columns: 320px 1fr 1fr;
            flex: 1;
            height: calc(100dvh - 75px);
            position: relative;
            transition: height 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .sidebar { background: rgba(5, 8, 6, 0.6); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-right: 1px solid var(--border); padding: 1.5rem; display: flex; flex-direction: column; gap: 1.2rem; overflow: hidden; }
        .sidebar-controls { display: flex; gap: 10px; flex-shrink: 0; }
        .action-btn { background: linear-gradient(135deg, var(--accent-green), var(--accent-emerald)); color: #050806; border: none; padding: 12px; border-radius: 12px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 15px var(--accent-green-glow); transition: var(--transition-smooth); flex: 1; min-height: 44px; }
        .action-btn:active { transform: scale(0.96); }

        .list-container { display: flex; flex-direction: column; gap: 10px; overflow-y: auto; padding-right: 4px; padding-bottom: 2rem; }
        .snippet-card { background: var(--panel-bg); border: 1px solid var(--border); padding: 1.2rem; border-radius: 14px; cursor: pointer; position: relative; overflow: hidden; transition: var(--transition-smooth); }
        .snippet-card::before { content: ''; position: absolute; left: 0; top: 0; height: 100%; width: 4px; background: var(--accent-green); transform: scaleY(0); transition: var(--transition-smooth); }
        .snippet-card.active { border-color: rgba(0, 255, 102, 0.4); background: rgba(0, 255, 102, 0.05); }
        .snippet-card.active::before { transform: scaleY(1); }
        .snippet-card h5 { font-size: 0.95rem; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-light); }
        .snippet-card.active h5 { color: var(--accent-green); }
        .snippet-card p { font-size: 0.8rem; color: var(--text-gray); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .editor-zone { display: flex; flex-direction: column; border-right: 1px solid var(--border); background: rgba(5, 8, 6, 0.3); position: relative; }
        .zone-header { padding: 1rem 1.2rem; background: var(--panel-bg); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-shrink: 0; }
        .zone-header input { background: transparent; border: none; color: white; font-weight: 600; outline: none; font-size: 16px; width: 100%; border-bottom: 1px solid transparent; padding: 8px 0; }
        .zone-header input:focus { border-bottom-color: var(--accent-green); }
        .ctrl-btns { display: flex; gap: 8px; flex-shrink: 0; }
        
        .icon-btn { background: rgba(255,255,255,0.02); border: 1px solid var(--border); color: var(--text-gray); min-width: 44px; height: 44px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: var(--transition-smooth); }
        .icon-btn:active { transform: scale(0.92); background: rgba(0, 255, 102, 0.1); }

        .code-area { flex: 1; background: transparent; border: none; resize: none; outline: none; padding: 1.5rem; color: #c9decb; font-family: 'Fira Code', monospace; line-height: 1.7; font-size: 16px; width: 100%; }

        .preview-zone { background: white; display: flex; flex-direction: column; height: 100%; overflow: hidden; }
        
        .preview-header { 
            background: rgba(10, 16, 16, 0.95); 
            padding: 1rem 1.5rem; 
            border-bottom: 1px solid var(--border); 
            color: var(--text-gray); 
            font-size: 0.8rem; 
            font-weight: 700; 
            letter-spacing: 1.5px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            transition: padding-top 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .preview-header .status { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
        .preview-header span.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent-green); box-shadow: 0 0 10px var(--accent-green); }

        .iframe-wrapper { width: 100%; flex: 1; overflow: auto; background: white; -webkit-overflow-scrolling: touch; }
        iframe { width: 100%; height: 100%; border: none; display: block; background: white; }

        @media (max-width: 900px) {
            nav { padding: 0.8rem; flex-wrap: wrap; gap: 10px; }
            .brand { width: 100%; justify-content: center; padding-bottom: 5px; }
            .mode-switcher { flex: 1; justify-content: center; }
            .mode-btn { flex: 1; justify-content: center; }
            .view-switcher { display: flex; flex: 1; }
            .switch-btn { flex: 1; text-align: center; }
            
            .main-layout { grid-template-columns: 1fr; position: relative; height: calc(100dvh - 125px); }

            .sidebar, .editor-zone, .preview-zone {
                position: absolute; width: 100%; height: 100%; top: 0; left: 0;
                opacity: 0; transform: translateX(10%); pointer-events: none;
                transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
                background: var(--bg-dark); z-index: 1;
            }

            .main-layout.show-list .sidebar,
            .main-layout.show-editor .editor-zone,
            .main-layout.show-preview .preview-zone {
                opacity: 1; transform: translateX(0); pointer-events: auto; z-index: 5;
            }
            .main-layout.show-list .editor-zone, .main-layout.show-list .preview-zone { transform: translateX(-10%); }
            .main-layout.show-editor .preview-zone { transform: translateX(-10%); }
        }
    </style>
</head>
<body>

    <!-- NAV BAR -->
    <nav>
        <div class="brand"><i class="fa-solid fa-layer-group"></i> NEO<span>VAULT</span></div>
        
        <div class="mode-switcher">
            <button class="mode-btn active" id="mode-code" onclick="switchSystemMode('code')"><i class="fa-solid fa-code"></i> CODE</button>
            <button class="mode-btn" id="mode-prompt" onclick="switchSystemMode('prompt')"><i class="fa-solid fa-brain"></i> PROMPT</button>
        </div>

        <div class="view-switcher">
            <button class="switch-btn active" id="btn-list" onclick="switchMobileView('list')"><i class="fa-solid fa-list"></i> Vault</button>
            <button class="switch-btn" id="btn-editor" onclick="switchMobileView('editor')"><i class="fa-solid fa-pen-to-square"></i> Editor</button>
            <button class="switch-btn" id="btn-preview" onclick="switchMobileView('preview')"><i class="fa-solid fa-play"></i> View</button>
        </div>
    </nav>

    <!-- MAIN INTERFACE -->
    <div class="main-layout show-list" id="mainLayout">
        
        <aside class="sidebar">
            <div class="sidebar-controls">
                <button class="action-btn" id="actionBtn" onclick="addNewItem()"><i class="fa-solid fa-plus"></i> New</button>
                <button class="icon-btn" onclick="exportData()" title="Backup Data"><i class="fa-solid fa-file-export"></i></button>
                <button class="icon-btn" onclick="document.getElementById('importFile').click()" title="Restore Data"><i class="fa-solid fa-file-import"></i></button>
                <input type="file" id="importFile" style="display:none" onchange="importData(event)" accept=".json">
            </div>
            <div class="list-container" id="listContainer"></div>
        </aside>

        <section class="editor-zone">
            <div class="zone-header">
                <input type="text" id="titleInput" value="Untitled" oninput="saveCurrentData()">
                <div class="ctrl-btns">
                    <button class="icon-btn" id="templateBtn" onclick="insertTemplate()"><i class="fa-solid fa-code"></i></button>
                    <button class="icon-btn" id="copyBtn" onclick="copyToClipboard()"><i class="fa-solid fa-copy"></i></button>
                    <button class="icon-btn" onclick="deleteCurrentItem()" style="color: #ff4545;"><i class="fa-solid fa-trash"></i></button>
                </div>
            </div>
            <textarea class="code-area" id="editor" placeholder="Write here..." oninput="liveRender()"></textarea>
        </section>

        <!-- 3. LIVE PREVIEW ZONE -->
        <section class="preview-zone">
            <div class="preview-header">
                <div class="status" id="previewStatus"><span class="dot"></span> LIVE OUTPUT</div>
                
                <!-- ชุดสถานะ & ปุ่มขยายเต็มจอ -->
                <div style="display: flex; align-items: center; gap: 15px;">
                    <div id="saveStatus" style="font-size: 0.75rem; color: #00ff66; font-weight: 600;">Saved</div>
                    <button class="icon-btn" id="fullscreenBtn" onclick="toggleFullscreen()" style="min-width: 38px; height: 38px; border-radius: 8px;">
                        <i class="fa-solid fa-expand"></i>
                    </button>
                </div>
            </div>
            <div class="iframe-wrapper">
                <iframe id="outputFrame" sandbox="allow-scripts allow-same-origin"></iframe>
            </div>
        </section>

    </div>

    <!-- LOGIC ENGINE -->
    <script>
        const defaultCodeData = [
            { id: 101, title: "iOS Safe Gradient", code: "<div style='min-height:100vh; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg, #0f2027, #203a43, #2c5364); font-family:sans-serif; color:white; text-align:center; padding:20px;'>\n  <div>\n    <h1 style='color:#00ff66;'>System Ready</h1>\n    <p>Safe layout designed for modern mobile displays.</p>\n  </div>\n</div>" }
        ];

        const defaultPromptData = [
            { id: 201, title: "iOS App Idea Validator", code: "คุณคือ Product Manager ระดับ Senior ของ Apple\n\nจงวิเคราะห์ไอเดียแอปพลิเคชันต่อไปนี้:\n1. ความเป็นไปได้ทางเทคนิค (iOS APIs)\n2. กลุ่มเป้าหมาย\n3. วิธีหาเงิน (Monetization)\n\n[ใส่ไอเดียแอปของคุณที่นี่]" }
        ];

        let currentMode = 'code';
        let storage = [];
        let activeId = null;
        let isFullscreen = false; // สถานะ Fullscreen

        function initSystemMode() {
            const key = currentMode === 'code' ? 'neo_vault_db_code_v2' : 'neo_vault_db_prompt_v2';
            storage = JSON.parse(localStorage.getItem(key)) || (currentMode === 'code' ? defaultCodeData : defaultPromptData);
            activeId = storage.length > 0 ? storage[0].id : Date.now();
            
            document.getElementById('actionBtn').innerHTML = currentMode === 'code' ? `<i class="fa-solid fa-plus"></i> New Code` : `<i class="fa-solid fa-plus"></i> New Prompt`;
            document.getElementById('editor').style.fontFamily = currentMode === 'code' ? "'Fira Code', monospace" : "'Plus Jakarta Sans', sans-serif";
            document.getElementById('previewStatus').innerHTML = currentMode === 'code' ? `<span class="dot"></span> WEB PREVIEW` : `<span class="dot"></span> PROMPT VIEW`;
            document.getElementById('templateBtn').innerHTML = currentMode === 'code' ? `<i class="fa-solid fa-laptop-code"></i>` : `<i class="fa-solid fa-file-invoice"></i>`;
            
            renderSidebar();
            selectItem(activeId);
        }

        function switchSystemMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`mode-${mode}`).classList.add('active');
            initSystemMode();
        }

        function updateLocalStorage() {
            const key = currentMode === 'code' ? 'neo_vault_db_code_v2' : 'neo_vault_db_prompt_v2';
            localStorage.setItem(key, JSON.stringify(storage));
            const statusNode = document.getElementById('saveStatus');
            statusNode.innerText = "Saving...";
            statusNode.style.color = "#fff";
            setTimeout(() => { statusNode.innerText = "Saved"; statusNode.style.color = "#00ff66"; }, 400);
        }

        function renderSidebar() {
            const container = document.getElementById('listContainer');
            container.innerHTML = '';
            storage.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = `snippet-card ${item.id === activeId ? 'active' : ''}`;
                card.onclick = () => selectItem(item.id);
                const cleanPreview = (item.code || "").replace(/</g, "&lt;").substring(0, 40);
                card.innerHTML = `<h5>${item.title || 'Untitled'}</h5><p>${cleanPreview || '...'}</p>`;
                container.appendChild(card);
            });
        }

        function selectItem(id) {
            activeId = id;
            const current = storage.find(item => item.id === id);
            if(current) {
                document.getElementById('titleInput').value = current.title;
                document.getElementById('editor').value = current.code;
                liveRender(false);
                renderSidebar();
            }
            if(window.innerWidth <= 900) switchMobileView('editor');
        }

        function liveRender(shouldSave = true) {
            const code = document.getElementById('editor').value;
            const iframe = document.getElementById('outputFrame');
            
            if (currentMode === 'code') {
                iframe.srcdoc = code;
            } else {
                const htmlPromptView = `
                    <!DOCTYPE html><html><head><style>
                        body { background: #090d16; color: #e2e8f0; font-family: system-ui, -apple-system, sans-serif; padding: 20px; margin: 0; line-height: 1.6; font-size: 16px; }
                        .prompt-box { border: 1px solid rgba(0, 255, 102, 0.15); padding: 20px; background: rgba(10, 16, 16, 0.7); border-radius: 12px; white-space: pre-wrap; word-wrap: break-word; }
                        .tag { display: inline-block; background: rgba(0, 255, 102, 0.1); color: #00ff66; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 700; margin-bottom: 15px; }
                    </style></head><body>
                        <div class="tag">PROMPT RENDER</div>
                        <div class="prompt-box">${code ? code.replace(/</g, "&lt;").replace(/>/g, "&gt;") : '<span style="color:#666">No content...</span>'}</div>
                    </body></html>
                `;
                iframe.srcdoc = htmlPromptView;
            }
            
            if(shouldSave) saveCurrentData();
        }

        function saveCurrentData() {
            const current = storage.find(item => item.id === activeId);
            if(current) {
                current.title = document.getElementById('titleInput').value;
                current.code = document.getElementById('editor').value;
                updateLocalStorage();
            }
        }

        function addNewItem() {
            const newId = Date.now();
            const newItem = currentMode === 'code' 
                ? { id: newId, title: "New Snippet", code: "<!-- HTML Here -->" }
                : { id: newId, title: "New Prompt", code: "คำสั่งของคุณ..." };
            storage.unshift(newItem);
            activeId = newId;
            updateLocalStorage();
            renderSidebar();
            selectItem(newId);
        }

        function deleteCurrentItem() {
            if(storage.length <= 1) return alert("Cannot delete the last item.");
            storage = storage.filter(item => item.id !== activeId);
            activeId = storage[0].id;
            updateLocalStorage();
            selectItem(activeId);
        }

        function insertTemplate() {
            const template = currentMode === 'code' 
                ? `<!DOCTYPE html>\n<meta name="viewport" content="width=device-width, initial-scale=1.0">\n<style>\n  body { font-family: -apple-system, sans-serif; padding: 20px; }\n  .btn { background: #007aff; color: white; padding: 12px 20px; border: none; border-radius: 8px; width: 100%; font-size: 16px; }\n</style>\n<body>\n  <h2>Native iOS Style</h2>\n  <button class="btn">Tap Me</button>\n</body>`
                : `[Role]: ผู้เชี่ยวชาญด้าน ...\n[Task]: ช่วยอธิบาย ...\n[Tone]: เข้าใจง่าย`;
            document.getElementById('editor').value = template;
            liveRender();
        }

        function copyToClipboard() {
            const code = document.getElementById('editor').value;
            navigator.clipboard.writeText(code);
            const btn = document.getElementById('copyBtn');
            btn.innerHTML = '<i class="fa-solid fa-check"></i>';
            btn.style.color = 'var(--accent-green)';
            setTimeout(() => { btn.innerHTML = '<i class="fa-solid fa-copy"></i>'; btn.style.color = ''; }, 1500);
        }

        function exportData() {
            const dataStr = JSON.stringify(storage, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `NeoVault_Backup_${currentMode}_${new Date().getTime()}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if(Array.isArray(imported) && imported.length > 0) {
                        storage = imported; updateLocalStorage(); renderSidebar(); selectItem(storage[0].id);
                        alert("Data restored successfully.");
                    }
                } catch (err) { alert("Error reading backup file."); }
                event.target.value = ''; 
            };
            reader.readAsText(file);
        }

        function switchMobileView(viewName) {
            const layout = document.getElementById('mainLayout');
            layout.className = 'main-layout';
            layout.classList.add(`show-${viewName}`);

            document.querySelectorAll('.switch-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${viewName}`).classList.add('active');
        }

        // 🟢 ฟังก์ชันควบคุมระบบ Fullscreen 🟢
        function toggleFullscreen() {
            isFullscreen = !isFullscreen;
            const btn = document.getElementById('fullscreenBtn');
            
            if(isFullscreen) {
                document.body.classList.add('fullscreen-mode');
                btn.innerHTML = '<i class="fa-solid fa-compress"></i>';
                btn.style.color = 'var(--accent-green)';
                btn.style.borderColor = 'var(--accent-green)';
                btn.style.background = 'rgba(0, 255, 102, 0.1)';
            } else {
                document.body.classList.remove('fullscreen-mode');
                btn.innerHTML = '<i class="fa-solid fa-expand"></i>';
                btn.style.color = 'var(--text-gray)';
                btn.style.borderColor = 'var(--border)';
                btn.style.background = 'rgba(255,255,255,0.02)';
            }
        }

        window.onload = () => {
            if(window.innerWidth > 900) { document.getElementById('mainLayout').className = 'main-layout show-list'; }
            initSystemMode();
        };
    </script>
</body>
</html>
