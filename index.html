<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEO_VAULT V2 // Cyber Green Edition</title>
    
    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- DESIGN SYSTEM & ANIMATIONS (CYBER GREEN) --- */
        :root {
            --bg-dark: #06080c;
            --panel-bg: rgba(10, 16, 16, 0.7);
            --accent-green: #00ff66;
            --accent-green-glow: rgba(0, 255, 102, 0.35);
            --accent-emerald: #00b34a;
            --text-light: #f0f5f2;
            --text-gray: #6b7a70;
            --border: rgba(0, 255, 102, 0.08);
            --transition-smooth: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(at 0% 0%, rgba(0, 255, 102, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(0, 179, 74, 0.05) 0px, transparent 50%);
            color: var(--text-light);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* App Custom Scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.3);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 255, 102, 0.2);
            border-radius: 10px;
            transition: var(--transition-smooth);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-green);
            box-shadow: 0 0 10px var(--accent-green);
        }

        @keyframes fadeInSlide {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 8px rgba(0, 255, 102, 0.4); }
            50% { box-shadow: 0 0 18px rgba(0, 255, 102, 0.7); }
            100% { box-shadow: 0 0 8px rgba(0, 255, 102, 0.4); }
        }

        /* --- NAVIGATION BAR --- */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 2rem;
            background: rgba(6, 12, 9, 0.6);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            z-index: 10;
        }

        .brand {
            font-weight: 700;
            font-size: 1.3rem;
            letter-spacing: 1.5px;
            color: var(--text-light);
            display: flex;
            align-items: center;
            gap: 12px;
            transition: var(--transition-smooth);
        }
        .brand:hover {
            transform: scale(1.03);
            text-shadow: 0 0 15px var(--accent-green-glow);
        }
        .brand i {
            color: var(--accent-green);
            animation: pulseGlow 3s infinite;
            border-radius: 50%;
        }
        .brand span { color: var(--accent-emerald); }

        /* --- MOBILE VIEW SWITCHER --- */
        .view-switcher {
            display: none;
            background: rgba(255, 255, 255, 0.02);
            padding: 4px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .switch-btn {
            background: transparent;
            border: none;
            color: var(--text-gray);
            padding: 8px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: var(--transition-smooth);
        }

        .switch-btn.active {
            color: #000;
            background: var(--accent-green);
            box-shadow: 0 4px 15px var(--accent-green-glow);
            font-weight: 700;
        }

        /* --- MAIN CORE LAYOUT --- */
        .main-layout {
            display: grid;
            grid-template-columns: 300px 1fr 1fr;
            flex: 1;
            height: calc(100vh - 73px);
        }

        /* --- SECTION 1: SIDEBAR --- */
        .sidebar {
            background: rgba(5, 8, 6, 0.4);
            backdrop-filter: blur(10px);
            border-right: 1px solid var(--border);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .action-btn {
            background: linear-gradient(135deg, var(--accent-green), var(--accent-emerald));
            color: #050806;
            border: none;
            padding: 0.9rem;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 15px var(--accent-green-glow);
            transition: var(--transition-smooth);
        }

        .action-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 255, 102, 0.5);
            filter: brightness(1.1);
        }

        .list-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .snippet-card {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            padding: 1.2rem;
            border-radius: 14px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: var(--transition-smooth);
            animation: fadeInSlide 0.4s ease-out forwards;
        }

        .snippet-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 4px;
            background: var(--accent-green);
            transform: scaleY(0);
            transition: var(--transition-smooth);
        }

        .snippet-card:hover {
            background: rgba(0, 255, 102, 0.03);
            border-color: rgba(0, 255, 102, 0.2);
            transform: translateX(5px);
        }

        .snippet-card.active {
            border-color: rgba(0, 255, 102, 0.3);
            background: rgba(0, 255, 102, 0.05);
        }

        .snippet-card.active::before { transform: scaleY(1); }

        .snippet-card h5 {
            font-size: 0.95rem;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: color 0.3s;
        }
        .snippet-card.active h5 { color: var(--accent-green); }

        .snippet-card p {
            font-size: 0.8rem;
            color: var(--text-gray);
        }

        /* --- SECTION 2: EDITOR --- */
        .editor-zone {
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
            background: rgba(5, 8, 6, 0.2);
        }

        .zone-header {
            padding: 1rem 1.5rem;
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .zone-header input {
            background: transparent;
            border: none;
            color: white;
            font-weight: 600;
            outline: none;
            font-size: 1.05rem;
            width: 60%;
            transition: var(--transition-smooth);
            border-bottom: 1px solid transparent;
        }
        .zone-header input:focus {
            border-bottom-color: var(--accent-green);
        }

        .ctrl-btns {
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            background: rgba(255,255,255,0.01);
            border: 1px solid var(--border);
            color: var(--text-gray);
            width: 38px;
            height: 38px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition-smooth);
        }

        .icon-btn:hover {
            color: var(--accent-green);
            border-color: var(--accent-green);
            transform: translateY(-2px) scale(1.05);
            background: rgba(0, 255, 102, 0.04);
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.1);
        }

        .code-area {
            flex: 1;
            background: transparent;
            border: none;
            resize: none;
            outline: none;
            padding: 1.8rem;
            color: #c9decb;
            font-family: 'Fira Code', monospace;
            font-size: 0.95rem;
            line-height: 1.7;
        }

        /* --- SECTION 3: LIVE PREVIEW (FIXED SCROLLING) --- */
        .preview-zone {
            background: white;
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden; /* บังคับให้คุมผ่าน Container ด้านใน */
        }

        .preview-header {
            background: rgba(10, 16, 16, 0.95);
            backdrop-filter: blur(10px);
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
            color: var(--text-gray);
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .preview-header span {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--accent-green);
            box-shadow: 0 0 10px var(--accent-green);
        }

        /* แก้ไขตรงนี้: เปิดให้ผลลัพธ์สามารถสกรอลล์ได้อย่างเสรีเมื่อเนื้อหาล้นหน้าต่าง */
        .iframe-wrapper {
            width: 100%;
            flex: 1;
            overflow: auto; /* เปิดใช้งาน scrollbar */
            background: white;
            -webkit-overflow-scrolling: touch; /* เพิ่มความสมูทในการใช้นิ้วถูบนหน้าจอมือถือ */
        }

        iframe {
            width: 100%;
            height: 100%;
            min-height: 100%; /* การันตีการดันพื้นที่ */
            border: none;
            display: block;
            background: white;
            transition: opacity 0.2s ease;
        }

        /* --- RESPONSIVE ANIMATIONS (MOBILE) --- */
        @media (max-width: 900px) {
            .view-switcher { display: flex; }
            .main-layout { grid-template-columns: 1fr; position: relative; }

            .sidebar, .editor-zone, .preview-zone {
                position: absolute;
                width: 100%;
                height: 100%;
                top: 0;
                left: 0;
                opacity: 0;
                transform: translateX(30px);
                pointer-events: none;
                transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
            }

            .main-layout.show-list .sidebar,
            .main-layout.show-editor .editor-zone,
            .main-layout.show-preview .preview-zone {
                opacity: 1;
                transform: translateX(0);
                pointer-events: auto;
                z-index: 5;
            }
            
            .main-layout.show-list .editor-zone, .main-layout.show-list .preview-zone { transform: translateX(-30px); }
            .main-layout.show-editor .preview-zone { transform: translateX(-30px); }
        }
    </style>
</head>
<body>

    <!-- NAV BAR -->
    <nav>
        <div class="brand"><i class="fa-solid fa-terminal"></i> NEO<span>VAULT</span></div>
        
        <!-- Mobile Switcher Tabs -->
        <div class="view-switcher">
            <button class="switch-btn active" id="btn-list" onclick="switchMobileView('list')">Vault</button>
            <button class="switch-btn" id="btn-editor" onclick="switchMobileView('editor')">Editor</button>
            <button class="switch-btn" id="btn-preview" onclick="switchMobileView('preview')">Preview</button>
        </div>
    </nav>

    <!-- MAIN INTERFACE -->
    <div class="main-layout show-list" id="mainLayout">
        
        <!-- 1. SIDEBAR -->
        <aside class="sidebar">
            <button class="action-btn" onclick="addNewCode()"><i class="fa-solid fa-plus"></i> New Snippet</button>
            <div class="list-container" id="listContainer">
                <!-- Injected via JavaScript -->
            </div>
        </aside>

        <!-- 2. EDITOR -->
        <section class="editor-zone">
            <div class="zone-header">
                <input type="text" id="titleInput" value="Untitled" oninput="saveCurrentData()">
                <div class="ctrl-btns">
                    <button class="icon-btn" title="Insert HTML5 Boilerplate" onclick="insertTemplate()"><i class="fa-solid fa-code"></i></button>
                    <button class="icon-btn" title="Copy Code" onclick="copyToClipboard()"><i class="fa-solid fa-copy"></i></button>
                    <button class="icon-btn" title="Delete Snippet" onclick="deleteCurrentCode()" style="color: #ff4545;"><i class="fa-solid fa-trash"></i></button>
                </div>
            </div>
            <textarea class="code-area" id="editor" placeholder="Write HTML, CSS or JS here... Output updates instantly." oninput="liveRender()"></textarea>
        </section>

        <!-- 3. LIVE PREVIEW (WITH SCROLL FIX) -->
        <section class="preview-zone">
            <div class="preview-header">
                <span></span> LIVE INTERACTIVE OUTPUT
            </div>
            <!-- Wrapper ที่เปิดให้ Scrollable ได้ -->
            <div class="iframe-wrapper">
                <iframe id="outputFrame"></iframe>
            </div>
        </section>

    </div>

    <!-- LOGIC ENGINE -->
    <script>
        // Default English Mock Data
        let storage = [
            { id: 1, title: "Modern Welcome Page", code: "<div style='padding: 40px; text-align: center; font-family: system-ui, sans-serif;'>\n  <h1 style='color: #00b34a; font-size: 36px; margin-bottom: 10px;'>⚡ Code Vault Ready</h1>\n  <p style='color: #444; font-size: 16px; max-width: 400px; margin: 0 auto 30px;'>Type anything in the editor panel and see it update instantly here.</p>\n  <div style='height: 500px; background: #f0f3f1; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #888;'>[ Large Element To Test Scrollability ]</div>\n</div>" },
            { id: 2, title: "Cyber Glow Button", code: "<button style='background: linear-gradient(135deg, #00ff66, #00b34a); border: none; color: #000; padding: 16px 36px; font-size: 16px; font-weight: bold; border-radius: 12px; cursor: pointer; display: block; margin: 60px auto; box-shadow: 0 10px 25px rgba(0,255,102,0.3); transition: 0.3s; font-family: sans-serif;'>INITIALIZE CORE</button>" }
        ];

        let activeId = 1;

        function renderSidebar() {
            const container = document.getElementById('listContainer');
            container.innerHTML = '';
            storage.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = `snippet-card ${item.id === activeId ? 'active' : ''}`;
                card.style.animationDelay = `${index * 0.05}s`;
                card.onclick = () => selectCode(item.id);
                card.innerHTML = `
                    <h5>${item.title || 'Untitled'}</h5>
                    <p>${item.code.substring(0, 35).replace(/</g, "&lt;")}...</p>
                `;
                container.appendChild(card);
            });
        }

        function selectCode(id) {
            activeId = id;
            const current = storage.find(item => item.id === id);
            if(current) {
                document.getElementById('titleInput').value = current.title;
                document.getElementById('editor').value = current.code;
                
                const iframe = document.getElementById('outputFrame');
                iframe.style.opacity = 0;
                setTimeout(() => {
                    liveRender();
                    iframe.style.opacity = 1;
                }, 150);
                
                renderSidebar();
            }
            if(window.innerWidth <= 900) {
                switchMobileView('editor');
            }
        }

        function liveRender() {
            const code = document.getElementById('editor').value;
            const iframe = document.getElementById('outputFrame');
            const documentDoc = iframe.contentDocument || iframe.contentWindow.document;
            
            documentDoc.open();
            documentDoc.write(code);
            documentDoc.close();
            
            saveCurrentData();
        }

        function saveCurrentData() {
            const current = storage.find(item => item.id === activeId);
            if(current) {
                current.title = document.getElementById('titleInput').value;
                current.code = document.getElementById('editor').value;
                
                const activeCard = document.querySelector('.snippet-card.active h5');
                if(activeCard) activeCard.innerText = current.title;
            }
        }

        function addNewCode() {
            const newId = Date.now();
            const newItem = { id: newId, title: "New Project", code: "<!-- Write code here -->" };
            storage.unshift(newItem);
            activeId = newId;
            renderSidebar();
            selectCode(newId);
        }

        function deleteCurrentCode() {
            if(storage.length <= 1) return;
            storage = storage.filter(item => item.id !== activeId);
            activeId = storage[0].id;
            selectCode(activeId);
        }

        function insertTemplate() {
            const template = `<!DOCTYPE html>\n<html>\n<head>\n<style>\n  body { background: #0b0f19; color: #00ff66; text-align: center; padding-top: 60px; font-family: sans-serif; }\n  .box { border: 1px solid #00ff66; padding: 20px; max-width: 400px; margin: 20px auto; border-radius: 8px; box-shadow: 0 0 15px rgba(0,255,102,0.2); }\n</style>\n</head>\n<body>\n  <h1>HELLO WORLD</h1>\n  <div class="box">System is online and running.</div>\n</body>\n</html>`;
            document.getElementById('editor').value = template;
            liveRender();
        }

        function copyToClipboard() {
            const code = document.getElementById('editor').value;
            navigator.clipboard.writeText(code);
            alert("Copied to clipboard! 🚀");
        }

        function switchMobileView(viewName) {
            const layout = document.getElementById('mainLayout');
            layout.className = 'main-layout';
            
            if(viewName === 'list') layout.classList.add('show-list');
            if(viewName === 'editor') layout.classList.add('show-editor');
            if(viewName === 'preview') layout.classList.add('show-preview');

            document.querySelectorAll('.switch-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${viewName}`).classList.add('active');
        }

        window.onload = () => {
            if(window.innerWidth > 900) {
                const layout = document.getElementById('mainLayout');
                layout.className = 'main-layout show-list';
            }
            selectCode(activeId);
        };
    </script>
</body>
</html>
